name: Release

# Builds Stint.app, packages it as a .dmg and a .zip, and publishes a GitHub Release.
# Start it either way:
#   - push a version tag:   git tag v2.1.0 && git push origin v2.1.0
#   - or Actions › Release › Run workflow, and type the version (the tag is created for you)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Stint needs the macOS 27 SDK: GitHub's `xcode-27` image (or your own Mac via MACOS_RUNNER).
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    # Optional Developer ID signing and notarization. Without the secrets the release is
    # ad-hoc signed and users approve it once in System Settings › Privacy & Security.
    # Secrets are given only to the steps that use them, never to the whole job.
    steps:
      # Pinned to a commit so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Choose the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }} # to check the release doesn't exist yet
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::\"$VERSION\" isn't a version like 2.1 or 2.1.0."; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      # Before any credentials exist on the machine. The UI tests already ran in CI.
      - name: Test
        run: make test-unit

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}            # base64 .p12
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then echo "No certificate; building ad-hoc signed."; exit 0; fi
          # A throwaway keychain for the certificate and notarization credentials, deleted when
          # the job ends so nothing outlives it on a self-hosted Mac.
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          # Only codesign may use the key.
          security import "$CERTIFICATE" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          rm -f "$CERTIFICATE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}                # app-specific password
        run: |
          if [[ -z "$NOTARY_APPLE_ID" ]]; then echo "No notarization credentials; skipping."; exit 0; fi
          if [[ ! -f "${SIGNING_KEYCHAIN:-}" ]]; then echo "::error::Notarization needs the signing certificate."; exit 1; fi
          xcrun notarytool store-credentials stint-notary --keychain "$SIGNING_KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=stint-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the .dmg and .zip
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}            # "Developer ID Application: …"
        run: make package

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -f "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi

      # Also kept with the run, so a build can be downloaded even if publishing fails.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Stint-${{ env.VERSION }}
          path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${SIGNED:-}" ]]; then
            OPENING="Open the disk image and drag **Stint** into **Applications**."
          else
            OPENING="Open the disk image and drag **Stint** into **Applications**. This build isn't notarized, so the first time you open it macOS will stop it: open **System Settings › Privacy & Security** and click **Open Anyway** next to Stint."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          1. Download **Stint-$VERSION.dmg** below.
          2. $OPENING
          3. Stint appears in your menu bar.

          Requires macOS 27 on Apple silicon. Checksums are in **SHA256SUMS.txt**.
          EOF
          # --target creates the tag when the release is started from the Actions tab.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Stint $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

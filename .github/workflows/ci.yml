name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Stint targets macOS 27 and needs Xcode 27. Set the MACOS_RUNNER repository variable
    # if your runner label differs (e.g. a self-hosted Mac).
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: make test

      - name: Build app
        run: make app

      - uses: actions/upload-artifact@v4
        with:
          name: Stint.app
          path: build/Stint.app

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Stint needs the macOS 27 SDK: GitHub's `xcode-27` image, or your own Mac through the
    # MACOS_RUNNER repository variable. Pull requests from forks always use GitHub's runner:
    # their code is untrusted and must never run on your machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: make test

      - name: Build app
        run: make app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Stint.app
          path: build/Stint.app

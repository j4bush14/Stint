name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Stint needs the macOS 27 SDK: GitHub's `xcode-27` image, or your own Mac through the
    # MACOS_RUNNER repository variable. Pull requests from forks always use GitHub's runner:
    # their code is untrusted and must never run on your machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: make test

      - name: Build the .dmg and .zip
        run: make package

      # Installs the package as a user would and checks it, including that the app launches.
      - name: Verify the package
        run: make verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stint-build-${{ github.sha }}
          path: dist/*

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      # The build type-checks too (Next generates route types first, so tsc alone can't).
      - name: Type-check and build
        run: npm run build

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Blocked</title>
<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --secondary: #6e6e73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --text: #f5f5f7;
      --secondary: #98989d;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, system-ui, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  main { max-width: 420px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { margin: 0; color: var(--secondary); }
  .app { font-size: 13px; font-weight: 600; color: var(--secondary); margin-bottom: 20px; }
</style>
</head>
<body>
  <main>
    <div class="app">Stint</div>
    <h1 id="title">This site is blocked</h1>
    <p>It'll be available again when your focus session ends.</p>
  </main>
  <script>
    const site = new URLSearchParams(location.search).get("site");
    if (site) document.getElementById("title").textContent = site + " is blocked";
  </script>
</body>
</html>
